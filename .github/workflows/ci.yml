name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test & Vet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Run unit & Viva headless UI tests
        run: go test -v -count=1 ./...

      - name: Build release binary
        run: go build -trimpath -ldflags="-s -w" ./cmd/parla-viva

      - name: Build vivahead inspection binary (Linux)
        if: runner.os == 'Linux'
        run: go build -tags vivahead -o parla-viva-headless ./cmd/parla-viva

  race:
    name: Race Detector (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Run tests with -race
        run: go test -race -count=1 ./internal/dc ./internal/history ./internal/webxdc
